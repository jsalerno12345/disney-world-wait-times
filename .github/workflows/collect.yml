# Every 30 minutes: fetch live wait times, append them to data/raw/,
# rebuild the dashboard, and commit the result ("git scraping").
name: Collect wait times

on:
  schedule:
    - cron: "7,37 * * * *"   # off the top of the hour, when GitHub's scheduler is busiest
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect a snapshot
        run: python scripts/collect.py

      - name: Rebuild dashboard
        run: python scripts/build.py

      - name: Commit and push
        run: |
          git config user.name "wait-time-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw reports index.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
